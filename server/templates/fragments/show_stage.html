{#- The slideshow itself: two layers that blend, a video, the caption, and the controls that show on a tap. -#}
<div id="show" class="show" hidden
     data-lang="{{ lang }}" data-places="{{ places }}"
     data-t-empty="{{ t("pictures.empty") }}" data-t-failed="{{ t("pictures.failed") }}" data-t-count="{{ t("pictures.count") }}"
     data-t-paused="{{ t("pictures.paused") }}" data-t-music-failed="{{ t("pictures.music_failed") }}">
  <div class="show-stage" id="show-stage">
    <img class="show-layer" alt="" id="show-a">
    <img class="show-layer" alt="" id="show-b">
    <video class="show-video" id="show-video" playsinline preload="auto" hidden></video>
  </div>
  <div class="show-caption" id="show-caption"><span id="show-date"></span><span id="show-place"></span></div>
  <div class="show-controls" id="show-controls">
    <button type="button" class="show-btn" id="show-prev" aria-label="{{ t("pictures.prev") }}">&#x2039;</button>
    <button type="button" class="show-btn" id="show-pause" aria-label="{{ t("pictures.pause") }}">&#x23EF;</button>
    <button type="button" class="show-btn" id="show-next" aria-label="{{ t("pictures.next") }}">&#x203A;</button>
    <button type="button" class="show-btn show-close" id="show-close" aria-label="{{ t("pictures.close") }}">&#x2715;</button>
  </div>
  <div class="show-toast" id="show-toast" role="status" hidden></div>
  <audio id="show-music" preload="auto"></audio>
</div>
