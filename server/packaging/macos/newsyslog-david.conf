# Turns the logs of David over (newsyslog, once an hour): five old logs of 2 MB each, compressed.
# logfilename                      [owner:group]       mode count size  when flags
/var/log/david.log                                     644  5     2000  *    J
/var/log/david-reindex.log         _david:_david       644  3     1000  *    J
