# Temporary: names the failing app tests as annotations (review 2026-10-31). Deleted again with its branch.
name: probe-app-tests
on:
  push:
    branches: ["probe/app-tests"]
jobs:
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - name: tests
        run: |
          flutter test --reporter json > results.json || true
          python3 - <<'PY'
          import json
          names, errors = {}, {}
          for line in open("results.json"):
              try: e = json.loads(line)
              except Exception: continue
              t = e.get("type")
              if t == "testStart": names[e["test"]["id"]] = (e["test"]["name"], e["test"].get("url") or e["test"].get("root_url") or "")
              elif t == "error": errors.setdefault(e["testID"], []).append(e.get("error", "")[:600])
              elif t == "testDone" and e.get("result") != "success" and not e.get("hidden"):
                  n, u = names.get(e["testID"], ("?", ""))
                  msg = (n + " | " + u + " | " + " // ".join(errors.get(e["testID"], []))).replace("\n", " ").replace("%", "%25")
                  print("::error title=failed test::" + msg[:1500])
          PY
