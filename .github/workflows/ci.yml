# Tests on every push and pull request. On pushes to main and on tags v* the packages are built too:
#   - David (server): .deb, .rpm, .tar.gz          - Psalms for Linux: .deb, .rpm, .tar.gz
#   - Psalms for Android: .apk (one per processor type)
#   - Psalms for macOS: .zip and .dmg of the app (signed and notarized only with the Developer ID secrets, see docs/releasing.md)
#   - Psalms for iPhone and Psalms for iPad: two apps (two bundle ids), built on macOS runners; signed .ipa and the upload to
#     TestFlight only if the iOS secrets exist (see docs/releasing.md), otherwise only a build without signing as a check.
# A tag v1.2.3 also makes a release with all of them, their SHA256SUMS and, if a signing key is set
# up (secret GPG_PRIVATE_KEY), a signature of the sums.
# Android signing: set the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD; without them the APK is signed with the debug key
# (fine to try on a phone, not to publish).
# Also runs on Forgejo/Gitea Actions.
name: ci
on:
  push:
    branches: [main, development]
    tags: ["v*"]
  pull_request:
  # By hand (Actions -> ci -> Run workflow): builds everything and, for iOS, signs and uploads to TestFlight (with the secrets).
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the iOS builds to TestFlight"
        type: boolean
        default: true

# A newer run of the same kind on the same branch replaces the older one that is still running (a push replaces a push, a run started by hand
# replaces a run started by hand, they do not cancel each other). Runs of tags are never cancelled: they make the release.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  PIPEWIRE_DEPS: libpipewire-0.3-dev libspa-0.2-dev clang pkg-config

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      # The tests that unpack archives and write tags use these; without them they skip themselves.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg zip p7zip-full libacl1-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --release --locked

  audio:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: audio } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $PIPEWIRE_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: audio }
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Unit tests only: the scripts/verify*.sh checks need a running PipeWire.
      - run: cargo test --locked

  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # The version of the packages: the tag without its v, else the one in pubspec.yaml.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml | head -1)" >> "$GITHUB_OUTPUT"
          fi

  # The packages for Linux on both processors: amd64 and arm64 (Raspberry Pi 4 and 5, ARM servers); the arm64 runner is free for a public repository.
  package-server:
    needs: [server, audio]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $PIPEWIRE_DEPS libacl1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "server\naudio" }
      - run: cargo install cargo-deb cargo-generate-rpm --locked
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with: { name: "packages-server-${{ matrix.arch }}", path: dist/*, retention-days: 14 }

  # David for macOS: an installer package that sets the server up as a launchd daemon (server/packaging/macos/, docs/releasing.md).
  # Unsigned unless the secrets MACOS_CERTIFICATE_P12_BASE64 (Developer ID Application) and MACOS_INSTALLER_CERT_P12_BASE64 (Developer ID Installer),
  # both with the password MACOS_CERTIFICATE_PASSWORD, exist; notarized when the App Store Connect key secrets exist as well.
  package-server-macos:
    needs: [server, version]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_CERT_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - name: Check the files of the package
        run: CHECK_ONLY=1 VERSION=0.0.0 server/packaging/macos/build-pkg.sh
      - name: Build David (Apple silicon, and Intel if that works too)
        working-directory: server
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          mkdir -p ../build
          archs=arm64
          if cargo build --release --locked --target x86_64-apple-darwin; then
            lipo -create -output ../build/david target/aarch64-apple-darwin/release/david target/x86_64-apple-darwin/release/david
            archs=arm64,x86_64
          else
            echo "::warning::The Intel build failed: the package is for Apple silicon only."
            cp target/aarch64-apple-darwin/release/david ../build/david
          fi
          echo "ARCHS=$archs" >> "$GITHUB_ENV"
          lipo -info ../build/david
      - name: Certificates (only if the secrets exist)
        run: |
          if [ -n "$APP_CERT_BASE64" ] && [ -n "$INSTALLER_CERT_BASE64" ] && [ -n "$CERT_PASSWORD" ]; then
            keychain="$RUNNER_TEMP/macos-build.keychain-db"
            security create-keychain -p ci "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p ci "$keychain"
            echo "$APP_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/app.p12"
            echo "$INSTALLER_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/app.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security import "$RUNNER_TEMP/installer.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/productsign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$keychain"
            security list-keychains -d user -s "$keychain" login.keychain-db
            app_id=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
            installer_id=$(security find-identity -v "$keychain" | grep "Developer ID Installer" | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
            echo "APP_IDENTITY=$app_id" >> "$GITHUB_ENV"
            echo "INSTALLER_IDENTITY=$installer_id" >> "$GITHUB_ENV"
            echo "Signing as: $app_id / $installer_id"
          else
            echo "::warning::No Developer ID secrets: the package is not signed. Open it with a right click and Open."
          fi
      - name: Sign the program
        run: |
          if [ -n "${APP_IDENTITY:-}" ]; then
            codesign --force --options runtime --timestamp --sign "$APP_IDENTITY" build/david
          else
            codesign --force --sign - build/david
          fi
          codesign --verify --verbose build/david
      - name: Build the package
        run: |
          VERSION="$VERSION" BINARY=build/david OUT=dist ARCHITECTURES="$ARCHS" INSTALLER_IDENTITY="${INSTALLER_IDENTITY:-}" server/packaging/macos/build-pkg.sh
          ls -l dist
      - name: Notarize (only if signed and the App Store Connect key exists)
        run: |
          if [ -n "${INSTALLER_IDENTITY:-}" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_KEY_BASE64" ]; then
            echo "$ASC_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
            pkg="dist/david-server-$VERSION-macos.pkg"
            xcrun notarytool submit "$pkg" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
            xcrun stapler staple "$pkg"
            pkgutil --check-signature "$pkg"
          else
            echo "::warning::Not notarized (needs the Developer ID certificates and the App Store Connect key)."
          fi
      - uses: actions/upload-artifact@v4
        with: { name: packages-server-macos, path: "dist/*", retention-days: 14 }

  package-app-linux:
    needs: [app, audio, version]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest, nfpm: x86_64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, nfpm: arm64 }
    runs-on: ${{ matrix.runner }}
    # The arm64 build is new: it must not turn the whole run red until it works.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $PIPEWIRE_DEPS ninja-build libgtk-3-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: audio }
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'amd64'
        with: { channel: stable, cache: true }
      # Flutter publishes no SDK archive for Linux on arm64: the tool is taken from git (it fetches the arm64 Dart SDK itself).
      - name: Flutter from git (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install nfpm
        run: curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_${{ matrix.nfpm }}.tar.gz | sudo tar -xz -C /usr/local/bin nfpm
      - run: scripts/package-app.sh
      - uses: actions/upload-artifact@v4
        with: { name: "packages-app-linux-${{ matrix.arch }}", path: dist/*, retention-days: 14 }

  # Psalms for macOS: the app as .zip and .dmg. Without the Developer ID secrets it is not signed: macOS then asks the first time (see the warning).
  package-app-macos:
    needs: [app, version]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CERT_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build macos --release --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"
      - name: Sign and notarize (only if the Developer ID certificate exists)
        run: |
          app=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          echo "app: $app"
          if [ -z "$CERT_BASE64" ]; then
            echo "::warning::No MACOS_CERTIFICATE_P12_BASE64: the macOS app is not signed. Open it with a right click and Open, or run: xattr -dr com.apple.quarantine Psalm.app"
            exit 0
          fi
          keychain="$RUNNER_TEMP/macos.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/macos-cert.p12"
          security import "$RUNNER_TEMP/macos-cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)".*/\1/')
          if [ -z "$identity" ]; then
            echo "::error::The certificate is no Developer ID Application certificate."
            exit 1
          fi
          codesign --deep --force --options runtime --timestamp --entitlements macos/Runner/Release.entitlements --sign "$identity" --keychain "$keychain" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ -n "$ASC_KEY_ID" ]; then
            echo "$ASC_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
            xcrun stapler staple "$app"
          else
            echo "::warning::No App Store Connect key: the app is signed but not notarized."
          fi
      - name: Package
        run: |
          app=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          mkdir -p ../dist
          ditto -c -k --keepParent "$app" "../dist/psalm-$VERSION-macos.zip"
          hdiutil create -volname Psalms -srcfolder "$app" -ov -format UDZO "../dist/psalm-$VERSION-macos.dmg"
          ls -l ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages-app-macos
          path: dist/*
          retention-days: 14

  # David and Psalms for Windows: a .zip each (a PowerShell script in the server's zip sets the service up; docs/releasing.md). Not signed.
  package-server-windows:
    needs: [server, version]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - run: cargo build --release --locked
        working-directory: server
      - name: Make the zip
        shell: pwsh
        run: |
          $stage = "stage/david-server"
          New-Item -ItemType Directory -Force $stage, dist | Out-Null
          Copy-Item server/target/release/david.exe, server/packaging/windows/install-service.ps1, LICENSE, README.md $stage
          Compress-Archive -Path $stage -DestinationPath "dist/david-server-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: packages-server-windows, path: dist/*, retention-days: 14 }

  package-app-windows:
    needs: [app, version]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Visual Studio 2022 (not "latest"): the toolset of Visual Studio 2026 refuses the /await option and <experimental/coroutine> (error STL1011), which a plugin of the
    # Windows build still uses. Back to windows-latest when the plugin is fixed or replaced.
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release --build-name "$env:VERSION" --build-number "$env:GITHUB_RUN_NUMBER"
        working-directory: app
      - name: Make the zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "app/build/windows/x64/runner/Release/*" -DestinationPath "dist/psalms-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: packages-app-windows, path: dist/*, retention-days: 14 }

  package-android:
    needs: [app, version]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Release key (only if the secrets exist)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
            echo "Signing with the release key."
          else
            echo "::warning::No Android release key: the APK is signed with the debug key."
          fi
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"
      - name: Name the files
        run: |
          mkdir -p ../dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" -release.apk); abi=${abi#app-}
            cp "$f" "../dist/psalm-$VERSION-android-$abi.apk"
          done
          ls -l ../dist
      - uses: actions/upload-artifact@v4
        with: { name: packages-android, path: dist/*, retention-days: 14 }

  # The iOS app builds without signing on every push and pull request (a check that it still compiles); two products from one project.
  ios-build:
    needs: [app]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        product: [iphone, ipad]
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: cp ios/Flutter/Product-${{ matrix.product }}.xcconfig ios/Flutter/Product.xcconfig
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: The product has its own bundle id and device family
        run: |
          plist=build/ios/iphoneos/Runner.app/Info.plist
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          family=$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$plist" | tr -d ' \n')
          echo "bundle id: $id, device family: $family"
          case "${{ matrix.product }}" in
            iphone) [ "$id" = "com.the-abraham-box.psalm" ] && echo "$family" | grep -q "1" && ! echo "$family" | grep -q "2" ;;
            ipad) [ "$id" = "com.the-abraham-box.psalm.ipad" ] && echo "$family" | grep -q "2" && ! echo "$family" | grep -q "1" ;;
          esac
      - name: The Siri Intents extension is embedded with the version of the app
        run: |
          app=build/ios/iphoneos/Runner.app
          plist="$app/PlugIns/PsalmsIntents.appex/Info.plist"
          if [ ! -f "$plist" ]; then
            echo "::error::$plist is missing: the extension target PsalmsIntents is not embedded in the app."
            ls -R "$app" | head -50
            exit 1
          fi
          appid=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          extid=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          appver=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")
          extver=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          appname=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          extname=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          echo "app $appid $appname ($appver), extension $extid $extname ($extver)"
          [ "$extid" = "$appid.intents" ] || { echo "::error::The extension bundle id must be $appid.intents"; exit 1; }
          [ "$extver" = "$appver" ] && [ "$extname" = "$appname" ] || { echo "::error::The extension version differs from the app version"; exit 1; }

  # Signed apps for iPhone and iPad; the upload to TestFlight when the App Store Connect key is set.
  package-ios:
    needs: [app, version, ios-build]
    # Every push and every run by hand signs the iOS apps (the .ipa is an artifact); what goes to TestFlight is decided in the step "Should this build go to TestFlight?".
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        product: [iphone, ipad]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      PROFILE_BASE64: ${{ matrix.product == 'iphone' && secrets.IOS_PROFILE_IPHONE_BASE64 || secrets.IOS_PROFILE_IPAD_BASE64 }}
      # The profile of the Siri Intents extension (bundle id of the app + ".intents").
      PROFILE_INTENTS_BASE64: ${{ matrix.product == 'iphone' && secrets.IOS_PROFILE_IPHONE_INTENTS_BASE64 || secrets.IOS_PROFILE_IPAD_INTENTS_BASE64 }}
      ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Should this build go to TestFlight?
        id: up
        env:
          BEFORE: ${{ github.event.before }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          UPLOAD_INPUT: ${{ github.event.inputs.upload }}
        run: |
          upload=false
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              [ "$UPLOAD_INPUT" != "false" ] && upload=true ;;
            push)
              if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/main ]]; then
                upload=true
              elif [[ "$BEFORE" =~ ^0+$ ]] || ! git -C "$GITHUB_WORKSPACE" cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                upload=true   # new branch or history rewritten: no way to tell what changed
              elif git -C "$GITHUB_WORKSPACE" diff --name-only "$BEFORE" "$GITHUB_SHA" -- app/lib app/ios app/assets app/pubspec.yaml app/pubspec.lock app/l10n.yaml | grep -q .; then
                upload=true   # the files of the app changed
              fi
              # "[skip testflight]" in the commit message keeps a push out of TestFlight.
              if printf '%s' "$COMMIT_MESSAGE" | grep -qi '\[skip testflight\]'; then upload=false; fi ;;
          esac
          echo "TestFlight upload: $upload"
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
      - name: Signing material (only if the secrets exist)
        id: sign
        run: |
          if [ -z "$CERT_BASE64" ] || [ -z "$PROFILE_BASE64" ] || [ -z "$TEAM_ID" ]; then
            echo "::warning::No iOS signing secrets: no .ipa for ${{ matrix.product }} (the unsigned build above is the check)."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$PROFILE_INTENTS_BASE64" ]; then
            echo "::warning::No profile for the Siri Intents extension (IOS_PROFILE_IPHONE_INTENTS_BASE64 / IOS_PROFILE_IPAD_INTENTS_BASE64): no signed .ipa for ${{ matrix.product }}, only the unsigned build above (the app contains the extension, so it cannot be signed without its profile)."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          keychain="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          case "${{ matrix.product }}" in iphone) bundle=com.the-abraham-box.psalm ;; ipad) bundle=com.the-abraham-box.psalm.ipad ;; esac
          # Decodes a profile, checks that it belongs to the bundle id and has the Siri capability, installs it. Sets $name (the profile name).
          install_profile() {
            local b64="$1" want="$2" file="$RUNNER_TEMP/$3" uuid appid
            echo "$b64" | base64 -d > "$file.mobileprovision"
            security cms -D -i "$file.mobileprovision" > "$file.plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$file.plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$file.plist")
            appid=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$file.plist")
            echo "profile '$name' ($uuid) is for $appid"
            if [ "$appid" != "$TEAM_ID.$want" ]; then
              echo "::error::The profile '$name' is for $appid, but $TEAM_ID.$want is expected (wrong secret?)."; exit 1
            fi
            if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.siri' "$file.plist" > /dev/null 2>&1; then
              echo "::error::The profile '$name' does not contain the capability Siri: enable Siri on the App ID $want and make the profile again."; exit 1
            fi
            cp "$file.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          }
          install_profile "$PROFILE_BASE64" "$bundle" app
          app_name="$name"
          install_profile "$PROFILE_INTENTS_BASE64" "$bundle.intents" intents
          intents_name="$name"
          name="$app_name"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>$bundle</key><string>$name</string>
              <key>$bundle.intents</key><string>$intents_name</string>
            </dict>
          </dict></plist>
          EOF
          echo "profile_name=$name" >> "$GITHUB_OUTPUT"
          echo "intents_profile_name=$intents_name" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.sign.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - if: steps.sign.outputs.ready == 'true'
        run: |
          cp ios/Flutter/Product-${{ matrix.product }}.xcconfig ios/Flutter/Product.xcconfig
          # Manual signing with the certificate and the profile that were imported above (the project itself stays on automatic signing for Xcode).
          cat >> ios/Flutter/Product.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = ${{ steps.sign.outputs.profile_name }}
          PSALM_INTENTS_PROFILE = ${{ steps.sign.outputs.intents_profile_name }}
          EOF
          # The extension target (PsalmsIntents) sets PROVISIONING_PROFILE_SPECIFIER = $(PSALM_INTENTS_PROFILE) itself in the project file, which
          # wins over the line above for that target; both targets share the style, team and identity.
          # ios/Runner/Runner.entitlements is in the repository and always has Siri (com.apple.developer.siri; the project file points to it).
          # The name the person gave the device (iOS 16 and later give an app only "iPhone" without it) is added only when Apple has granted the entitlement and the
          # profiles were made again with it (repository variable IOS_DEVICE_NAME_ENTITLEMENT = true; see docs/releasing.md). Signing fails if the profile lacks it.
          if [ "${{ vars.IOS_DEVICE_NAME_ENTITLEMENT }}" = "true" ]; then
            /usr/libexec/PlistBuddy -c 'Add :com.apple.developer.device-information.user-assigned-device-name bool true' ios/Runner/Runner.entitlements
            echo "Entitlement user-assigned-device-name is on."
          fi
          /usr/libexec/PlistBuddy -c 'Print' ios/Runner/Runner.entitlements
          flutter pub get
          flutter build ipa --release --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER" --export-options-plist "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p ../dist
          cp build/ios/ipa/*.ipa "../dist/psalm-$VERSION-ios-${{ matrix.product }}.ipa"
      - name: Upload to TestFlight (only with the App Store Connect key)
        if: steps.sign.outputs.ready == 'true' && env.ASC_KEY_ID != '' && steps.up.outputs.upload == 'true'
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_BASE64" | base64 -d > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "../dist/psalm-$VERSION-ios-${{ matrix.product }}.ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - if: steps.sign.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: packages-ios-${{ matrix.product }}
          path: dist/*
          retention-days: 14

  release:
    needs: [package-server, package-server-macos, package-server-windows, package-app-linux, package-android, package-app-macos, package-app-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "packages-*", path: dist, merge-multiple: true }
      - name: Import the signing key (only if the secret exists)
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')" >> "$GITHUB_ENV"
          else
            echo "::warning::No GPG_PRIVATE_KEY: the checksums are published without a signature."
          fi
      - run: scripts/checksums.sh
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
