# Tests on every push and pull request. On pushes to main and on tags v* the packages are built too:
#   - David (server): .deb, .rpm, .tar.gz          - Psalm for Linux: .deb, .rpm, .tar.gz
#   - Psalm for Android: .apk (one per processor type)
# A tag v1.2.3 also makes a release with all of them, their SHA256SUMS and, if a signing key is set
# up (secret GPG_PRIVATE_KEY), a signature of the sums.
# Android signing: set the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD; without them the APK is signed with the debug key
# (fine to try on a phone, not to publish).
# Also runs on Forgejo/Gitea Actions.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  PIPEWIRE_DEPS: libpipewire-0.3-dev libspa-0.2-dev clang pkg-config

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      # The tests that unpack archives and write tags use these; without them they skip themselves.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg zip p7zip-full
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --release --locked

  audio:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: audio } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $PIPEWIRE_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: audio }
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Unit tests only: the scripts/verify*.sh checks need a running PipeWire.
      - run: cargo test --locked

  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # The version of the packages: the tag without its v, else the one in pubspec.yaml.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml | head -1)" >> "$GITHUB_OUTPUT"
          fi

  package-server:
    needs: [server, audio]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $PIPEWIRE_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "server\naudio" }
      - run: cargo install cargo-deb cargo-generate-rpm --locked
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with: { name: packages-server, path: dist/*, retention-days: 14 }

  package-app-linux:
    needs: [app, audio, version]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $PIPEWIRE_DEPS ninja-build libgtk-3-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: audio }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Install nfpm
        run: curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin nfpm
      - run: scripts/package-app.sh
      - uses: actions/upload-artifact@v4
        with: { name: packages-app-linux, path: dist/*, retention-days: 14 }

  package-android:
    needs: [app, version]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Release key (only if the secrets exist)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
            echo "Signing with the release key."
          else
            echo "::warning::No Android release key: the APK is signed with the debug key."
          fi
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"
      - name: Name the files
        run: |
          mkdir -p ../dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" -release.apk); abi=${abi#app-}
            cp "$f" "../dist/psalm-$VERSION-android-$abi.apk"
          done
          ls -l ../dist
      - uses: actions/upload-artifact@v4
        with: { name: packages-android, path: dist/*, retention-days: 14 }

  release:
    needs: [package-server, package-app-linux, package-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "packages-*", path: dist, merge-multiple: true }
      - name: Import the signing key (only if the secret exists)
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')" >> "$GITHUB_ENV"
          else
            echo "::warning::No GPG_PRIVATE_KEY: the checksums are published without a signature."
          fi
      - run: scripts/checksums.sh
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
