# Tests on every push and pull request. On pushes to main and on tags v* the packages are built too:
#   - David (server): .deb, .rpm, .tar.gz          - Psalm for Linux: .deb, .rpm, .tar.gz
#   - Psalm for Android: .apk (one per processor type)
#   - Psalm for macOS: .zip and .dmg of the app (signed and notarized only with the Developer ID secrets, see docs/releasing.md)
#   - Psalm for iPhone and Psalm for iPad: two apps (two bundle ids), built on macOS runners; signed .ipa and the upload to
#     TestFlight only if the iOS secrets exist (see docs/releasing.md), otherwise only a build without signing as a check.
# A tag v1.2.3 also makes a release with all of them, their SHA256SUMS and, if a signing key is set
# up (secret GPG_PRIVATE_KEY), a signature of the sums.
# Android signing: set the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD; without them the APK is signed with the debug key
# (fine to try on a phone, not to publish).
# Also runs on Forgejo/Gitea Actions.
name: ci
on:
  push:
    branches: [main, development]
    tags: ["v*"]
  pull_request:
  # By hand (Actions -> ci -> Run workflow): builds everything and, for iOS, signs and uploads to TestFlight (with the secrets).
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the iOS builds to TestFlight"
        type: boolean
        default: true

# A newer run of the same kind on the same branch replaces the older one that is still running (a push replaces a push, a run started by hand
# replaces a run started by hand, they do not cancel each other). Runs of tags are never cancelled: they make the release.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  PIPEWIRE_DEPS: libpipewire-0.3-dev libspa-0.2-dev clang pkg-config

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      # The tests that unpack archives and write tags use these; without them they skip themselves.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg zip p7zip-full libacl1-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --release --locked

  audio:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: audio } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $PIPEWIRE_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: audio }
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Unit tests only: the scripts/verify*.sh checks need a running PipeWire.
      - run: cargo test --locked

  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # The version of the packages: the tag without its v, else the one in pubspec.yaml.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml | head -1)" >> "$GITHUB_OUTPUT"
          fi

  package-server:
    needs: [server, audio]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $PIPEWIRE_DEPS libacl1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "server\naudio" }
      - run: cargo install cargo-deb cargo-generate-rpm --locked
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with: { name: packages-server, path: dist/*, retention-days: 14 }

  # David for macOS: an installer package that sets the server up as a launchd daemon (server/packaging/macos/, docs/releasing.md).
  # Unsigned unless the secrets MACOS_CERTIFICATE_P12_BASE64 (Developer ID Application) and MACOS_INSTALLER_CERT_P12_BASE64 (Developer ID Installer),
  # both with the password MACOS_CERTIFICATE_PASSWORD, exist; notarized when the App Store Connect key secrets exist as well.
  package-server-macos:
    needs: [server, version]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_CERT_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - name: Check the files of the package
        run: CHECK_ONLY=1 VERSION=0.0.0 server/packaging/macos/build-pkg.sh
      - name: Build David (Apple silicon, and Intel if that works too)
        working-directory: server
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          mkdir -p ../build
          archs=arm64
          if cargo build --release --locked --target x86_64-apple-darwin; then
            lipo -create -output ../build/david target/aarch64-apple-darwin/release/david target/x86_64-apple-darwin/release/david
            archs=arm64,x86_64
          else
            echo "::warning::The Intel build failed: the package is for Apple silicon only."
            cp target/aarch64-apple-darwin/release/david ../build/david
          fi
          echo "ARCHS=$archs" >> "$GITHUB_ENV"
          lipo -info ../build/david
      - name: Certificates (only if the secrets exist)
        run: |
          if [ -n "$APP_CERT_BASE64" ] && [ -n "$INSTALLER_CERT_BASE64" ] && [ -n "$CERT_PASSWORD" ]; then
            keychain="$RUNNER_TEMP/macos-build.keychain-db"
            security create-keychain -p ci "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p ci "$keychain"
            echo "$APP_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/app.p12"
            echo "$INSTALLER_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/app.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security import "$RUNNER_TEMP/installer.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/productsign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$keychain"
            security list-keychains -d user -s "$keychain" login.keychain-db
            app_id=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
            installer_id=$(security find-identity -v "$keychain" | grep "Developer ID Installer" | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
            echo "APP_IDENTITY=$app_id" >> "$GITHUB_ENV"
            echo "INSTALLER_IDENTITY=$installer_id" >> "$GITHUB_ENV"
            echo "Signing as: $app_id / $installer_id"
          else
            echo "::warning::No Developer ID secrets: the package is not signed. Open it with a right click and Open."
          fi
      - name: Sign the program
        run: |
          if [ -n "${APP_IDENTITY:-}" ]; then
            codesign --force --options runtime --timestamp --sign "$APP_IDENTITY" build/david
          else
            codesign --force --sign - build/david
          fi
          codesign --verify --verbose build/david
      - name: Build the package
        run: |
          VERSION="$VERSION" BINARY=build/david OUT=dist ARCHITECTURES="$ARCHS" INSTALLER_IDENTITY="${INSTALLER_IDENTITY:-}" server/packaging/macos/build-pkg.sh
          ls -l dist
      - name: Notarize (only if signed and the App Store Connect key exists)
        run: |
          if [ -n "${INSTALLER_IDENTITY:-}" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_KEY_BASE64" ]; then
            echo "$ASC_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
            pkg="dist/david-server-$VERSION-macos.pkg"
            xcrun notarytool submit "$pkg" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
            xcrun stapler staple "$pkg"
            pkgutil --check-signature "$pkg"
          else
            echo "::warning::Not notarized (needs the Developer ID certificates and the App Store Connect key)."
          fi
      - uses: actions/upload-artifact@v4
        with: { name: packages-server-macos, path: "dist/*", retention-days: 14 }

  package-app-linux:
    needs: [app, audio, version]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $PIPEWIRE_DEPS ninja-build libgtk-3-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: audio }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Install nfpm
        run: curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin nfpm
      - run: scripts/package-app.sh
      - uses: actions/upload-artifact@v4
        with: { name: packages-app-linux, path: dist/*, retention-days: 14 }

  # Psalm for macOS: the app as .zip and .dmg. Without the Developer ID secrets it is not signed: macOS then asks the first time (see the warning).
  package-app-macos:
    needs: [app, version]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CERT_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build macos --release --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"
      - name: Sign and notarize (only if the Developer ID certificate exists)
        run: |
          app=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          echo "app: $app"
          if [ -z "$CERT_BASE64" ]; then
            echo "::warning::No MACOS_CERTIFICATE_P12_BASE64: the macOS app is not signed. Open it with a right click and Open, or run: xattr -dr com.apple.quarantine Psalm.app"
            exit 0
          fi
          keychain="$RUNNER_TEMP/macos.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/macos-cert.p12"
          security import "$RUNNER_TEMP/macos-cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)".*/\1/')
          if [ -z "$identity" ]; then
            echo "::error::The certificate is no Developer ID Application certificate."
            exit 1
          fi
          codesign --deep --force --options runtime --timestamp --entitlements macos/Runner/Release.entitlements --sign "$identity" --keychain "$keychain" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ -n "$ASC_KEY_ID" ]; then
            echo "$ASC_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
            xcrun stapler staple "$app"
          else
            echo "::warning::No App Store Connect key: the app is signed but not notarized."
          fi
      - name: Package
        run: |
          app=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          mkdir -p ../dist
          ditto -c -k --keepParent "$app" "../dist/psalm-$VERSION-macos.zip"
          hdiutil create -volname Psalm -srcfolder "$app" -ov -format UDZO "../dist/psalm-$VERSION-macos.dmg"
          ls -l ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages-app-macos
          path: dist/*
          retention-days: 14

  package-android:
    needs: [app, version]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Release key (only if the secrets exist)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
            echo "Signing with the release key."
          else
            echo "::warning::No Android release key: the APK is signed with the debug key."
          fi
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"
      - name: Name the files
        run: |
          mkdir -p ../dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" -release.apk); abi=${abi#app-}
            cp "$f" "../dist/psalm-$VERSION-android-$abi.apk"
          done
          ls -l ../dist
      - uses: actions/upload-artifact@v4
        with: { name: packages-android, path: dist/*, retention-days: 14 }

  # The iOS app builds without signing on every push and pull request (a check that it still compiles); two products from one project.
  ios-build:
    needs: [app]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        product: [iphone, ipad]
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: cp ios/Flutter/Product-${{ matrix.product }}.xcconfig ios/Flutter/Product.xcconfig
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: The product has its own bundle id and device family
        run: |
          plist=build/ios/iphoneos/Runner.app/Info.plist
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          family=$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$plist" | tr -d ' \n')
          echo "bundle id: $id, device family: $family"
          case "${{ matrix.product }}" in
            iphone) [ "$id" = "com.the-abraham-box.psalm" ] && echo "$family" | grep -q "1" && ! echo "$family" | grep -q "2" ;;
            ipad) [ "$id" = "com.the-abraham-box.psalm.ipad" ] && echo "$family" | grep -q "2" && ! echo "$family" | grep -q "1" ;;
          esac

  # Signed apps for iPhone and iPad; the upload to TestFlight when the App Store Connect key is set.
  package-ios:
    needs: [app, version, ios-build]
    # Not on every push of development: a build in TestFlight is made for tags, for main and when somebody starts it by hand.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'))
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        product: [iphone, ipad]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      PROFILE_BASE64: ${{ matrix.product == 'iphone' && secrets.IOS_PROFILE_IPHONE_BASE64 || secrets.IOS_PROFILE_IPAD_BASE64 }}
      ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - name: Signing material (only if the secrets exist)
        id: sign
        run: |
          if [ -z "$CERT_BASE64" ] || [ -z "$PROFILE_BASE64" ] || [ -z "$TEAM_ID" ]; then
            echo "::warning::No iOS signing secrets: no .ipa for ${{ matrix.product }} (the unsigned build above is the check)."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          keychain="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/p.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/p.mobileprovision" > "$RUNNER_TEMP/p.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/p.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/p.plist")
          cp "$RUNNER_TEMP/p.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          case "${{ matrix.product }}" in iphone) bundle=com.the-abraham-box.psalm ;; ipad) bundle=com.the-abraham-box.psalm.ipad ;; esac
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$bundle</key><string>$name</string></dict>
          </dict></plist>
          EOF
          echo "profile_name=$name" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.sign.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - if: steps.sign.outputs.ready == 'true'
        run: |
          cp ios/Flutter/Product-${{ matrix.product }}.xcconfig ios/Flutter/Product.xcconfig
          # Manual signing with the certificate and the profile that were imported above (the project itself stays on automatic signing for Xcode).
          cat >> ios/Flutter/Product.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = ${{ steps.sign.outputs.profile_name }}
          EOF
          flutter pub get
          flutter build ipa --release --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER" --export-options-plist "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p ../dist
          cp build/ios/ipa/*.ipa "../dist/psalm-$VERSION-ios-${{ matrix.product }}.ipa"
      - name: Upload to TestFlight (only with the App Store Connect key)
        if: steps.sign.outputs.ready == 'true' && env.ASC_KEY_ID != '' && github.event.inputs.upload != 'false'
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_BASE64" | base64 -d > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "../dist/psalm-$VERSION-ios-${{ matrix.product }}.ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - if: steps.sign.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: packages-ios-${{ matrix.product }}
          path: dist/*
          retention-days: 14

  release:
    needs: [package-server, package-server-macos, package-app-linux, package-android, package-app-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "packages-*", path: dist, merge-multiple: true }
      - name: Import the signing key (only if the secret exists)
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')" >> "$GITHUB_ENV"
          else
            echo "::warning::No GPG_PRIVATE_KEY: the checksums are published without a signature."
          fi
      - run: scripts/checksums.sh
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
